<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Этапный эпикриз — мастер</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap');
:root{color-scheme:light;--ink:#18242b;--muted:#6c7c82;--line:#d8e2e3;--paper:#fbfdfc;--mint:#dff4ed;--mint-strong:#1e8a74;--coral:#e87862;--blue:#e8f1f7;--shadow:0 18px 45px rgba(24,54,58,.10)}
*{box-sizing:border-box}html{background:#eef4f2}body{margin:0;color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5;background:linear-gradient(120deg,#f1f7f5 0%,#eef3f7 45%,#f8f4ef 100%);min-height:100vh}.app-shell{max-width:1440px;margin:0 auto;min-height:100vh;padding:24px 30px 36px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 26px}.brand{display:flex;gap:13px;align-items:center}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#dff4ed;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:4px 5px 0 rgba(30,138,116,.22)}.brand-name{font-weight:800;letter-spacing:-.03em;font-size:17px}.brand-sub{font-size:12px;color:var(--muted);margin-top:1px}.safety{font-size:12px;color:#4f666b;background:rgba(255,255,255,.55);padding:8px 12px;border:1px solid rgba(216,226,227,.9);border-radius:9px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;align-items:start}.sidebar{position:sticky;top:24px;background:rgba(255,255,255,.67);border:1px solid rgba(216,226,227,.8);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow)}.side-title{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--muted);margin:0 0 18px}.steps{display:grid;gap:7px}.step{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:none;border:0;padding:11px 9px;border-radius:11px;color:#78878a;font:inherit;cursor:pointer}.step[disabled]{cursor:default}.step.active{background:var(--mint);color:var(--ink)}.step.done{color:var(--mint-strong)}.step-number{display:grid;place-items:center;flex:none;width:27px;height:27px;border:1px solid currentColor;border-radius:50%;font-size:12px;font-weight:800}.step.done .step-number{background:var(--mint-strong);color:#fff;border-color:var(--mint-strong)}.step-label{font-weight:700;font-size:13px}.progress-wrap{margin-top:25px;padding-top:18px;border-top:1px solid var(--line)}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}.progress{height:7px;background:#dce8e5;border-radius:20px;overflow:hidden}.progress-bar{height:100%;width:20%;background:var(--coral);border-radius:20px;transition:width .25s}.main{min-width:0}.main-card{background:var(--paper);border:1px solid rgba(216,226,227,.85);border-radius:20px;box-shadow:var(--shadow);min-height:700px;display:flex;flex-direction:column;overflow:hidden}.step-header{padding:35px 42px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.kicker{font-size:12px;color:var(--mint-strong);font-weight:800;margin:0 0 8px}.step-header h1{font-family:'Source Serif 4',Georgia,serif;font-size:38px;line-height:1.08;letter-spacing:-.035em;margin:0 0 10px;font-weight:600}.step-header p{color:var(--muted);font-size:14px;margin:0;max-width:680px}.status-chip{align-self:flex-start;color:#537078;background:var(--blue);font-size:12px;font-weight:700;padding:8px 11px;border-radius:7px;white-space:nowrap}.panel{padding:30px 42px;flex:1}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}.field label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:800;margin-bottom:8px}.field-hint{font-size:11px;font-weight:500;color:var(--muted)}input,textarea,select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid #cbd9da;border-radius:10px;padding:12px 13px;outline:0;transition:border .15s,box-shadow .15s}textarea{min-height:128px;resize:vertical;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:var(--mint-strong);box-shadow:0 0 0 4px rgba(30,138,116,.12)}.helper{font-size:12px;color:var(--muted);margin:9px 0 0}.subsection{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fcfefd;margin-top:18px}.subsection-title{font-size:13px;font-weight:800;margin:0 0 12px}.inline-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;align-items:end}.row-list{display:grid;gap:9px}.small-input{padding:10px 11px;font-size:13px}.icon-btn{width:38px;height:39px;border:1px solid #cbd9da;border-radius:9px;background:#fff;color:#718489;cursor:pointer;font-size:18px}.icon-btn:hover{color:#b85447;border-color:#e4a69b}.button{border:0;border-radius:9px;padding:12px 17px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:transform .15s,background .15s;display:inline-flex;align-items:center;gap:7px}.button:hover{transform:translateY(-1px)}.button.primary{background:var(--ink);color:#fff}.button.primary:hover{background:#29444b}.button.secondary{background:var(--mint);color:#176c5c}.button.ghost{color:#52676b;background:transparent;border:1px solid #cbd9da}.button.ghost:hover{background:#f1f6f4}.nav{padding:20px 42px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.nav-right{display:flex;gap:10px}.output-shell{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(270px,.7fr);gap:20px}.output-editor{min-height:520px;font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.68;background:#fffdf9;border-color:#e7ddd0}.output-title{font-size:13px;font-weight:800;margin:0 0 9px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.side-note{background:#eef7f3;border:1px solid #cfe9df;border-radius:13px;padding:17px;font-size:13px;color:#46625f}.side-note h3{font-size:13px;margin:0 0 8px}.side-note p{margin:0 0 12px}.variant-list{display:grid;gap:8px}.variant{border:1px solid #cbd9da;background:#fff;text-align:left;padding:10px 11px;border-radius:9px;color:#42585d;cursor:pointer;font:inherit;font-size:12px}.variant:hover{border-color:var(--mint-strong);background:#f8fffc}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:12px 15px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.hidden{display:none!important}.muted-block{color:var(--muted);font-size:13px;background:#f7faf9;border-radius:9px;padding:13px}.divider{height:1px;background:var(--line);margin:24px 0}@media(max-width:900px){.app-shell{padding:16px}.layout{grid-template-columns:1fr}.sidebar{position:static}.steps{grid-template-columns:repeat(5,1fr);gap:4px}.step{justify-content:center;padding:8px 3px}.step-label{display:none}.progress-wrap{display:none}.step-header{padding:26px 24px 20px}.panel{padding:24px}.nav{padding:18px 24px}.output-shell{grid-template-columns:1fr}}@media(max-width:600px){.topbar{align-items:flex-start;gap:10px;flex-direction:column}.safety{align-self:stretch}.steps{grid-template-columns:repeat(5,1fr)}.step-header h1{font-size:31px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.inline-row{grid-template-columns:1fr 1fr}.inline-row .icon-btn{grid-column:2;justify-self:end}.nav{padding:16px;flex-direction:column-reverse}.nav-right{justify-content:space-between}.button{justify-content:center}.status-chip{display:none}}
@media print{body{background:#fff}.app-shell{padding:0}.topbar,.sidebar,.step-header,.nav,.side-note,.tools,.output-title{display:none!important}.layout,.main,.main-card,.panel,.output-shell{display:block;box-shadow:none;border:0}.main-card{min-height:0}.output-editor{border:0;background:#fff;padding:0;min-height:0;font-size:12pt}.output-shell{padding:0}.output-shell:before{content:'Этапный эпикриз';display:block;font-family:Georgia,serif;font-weight:bold;font-size:18pt;margin-bottom:18pt}}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark">Э</div><div><div class="brand-name">Этапный эпикриз</div><div class="brand-sub">мастер клинической документации</div></div></div><div class="safety">Рабочий черновик · проверьте текст перед внесением в историю болезни</div></header>
<div class="layout">
<aside class="sidebar"><p class="side-title">Порядок заполнения</p><div class="steps" id="steps"></div><div class="progress-wrap"><div class="progress-label"><span>Заполнено</span><span id="progressText">1 из 5</span></div><div class="progress"><div class="progress-bar" id="progressBar"></div></div></div></aside>
<main class="main"><section class="main-card"><div class="step-header"><div><p class="kicker" id="stepKicker">Шаг 1 · поступление</p><h1 id="stepTitle">Контекст пациента</h1><p id="stepDescription">Минимальные данные, которые помогут собрать эпикриз в цельный документ.</p></div><div class="status-chip" id="statusChip">Черновик</div></div><div class="panel" id="panel"></div><div class="nav"><button class="button ghost" id="backBtn">← Назад</button><div class="nav-right"><button class="button secondary" id="demoBtn">Заполнить пример</button><button class="button primary" id="nextBtn">Далее&nbsp; →</button></div></div></section></main>
</div></div><div class="toast" id="toast"></div>
<script>
const steps=[
 {key:'context',label:'Поступление',title:'Контекст пациента',desc:'Минимальные данные, которые помогут собрать эпикриз в цельный документ.'},
 {key:'objective',label:'Статус',title:'Объективный статус',desc:'Зафиксируйте состояние пациента при поступлении — без лишней детализации, но с клиническими акцентами.'},
 {key:'treatment',label:'Лечение',title:'Что выполнено',desc:'Соберите проведённые мероприятия, терапию и реакцию на них в одну последовательность.'},
 {key:'labs',label:'Динамика',title:'Динамика исследований',desc:'Добавьте значимые показатели и поясните, как они изменялись в ходе наблюдения.'},
 {key:'current',label:'Осмотр',title:'Состояние на момент осмотра',desc:'Опишите актуальные жалобы и состояние пациента перед формированием итогового текста.'}
];
let current=0; let data={context:{},objective:{},treatment:{},labs:{rows:[]},current:{}}; let variants=[];
const $=s=>document.querySelector(s);
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderSteps(){ $('#steps').innerHTML=steps.map((s,i)=>`<button class="step ${i===current?'active':''} ${i<current?'done':''}" data-step="${i}" ${i>current?'disabled':''}><span class="step-number">${i<current?'✓':i+1}</span><span class="step-label">${s.label}</span></button>`).join(''); document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{current=+b.dataset.step;render()}); $('#progressText').textContent=`${Math.min(current+1,5)} из 5`; $('#progressBar').style.width=`${((current+1)/5)*100}%`}
function field(label,key,value='',opts={}){let tag=opts.text?'textarea':'input';let extra=opts.type?` type="${opts.type}"`:'';return `<div class="field ${opts.full?'full':''}"><label for="${key}">${label}${opts.hint?`<span class="field-hint">${opts.hint}</span>`:''}</label><${tag} id="${key}" data-key="${key}"${extra} placeholder="${opts.placeholder||''}">${opts.text?esc(value):''}</${tag}>${opts.help?`<p class="helper">${opts.help}</p>`:''}</div>`}
function renderPanel(){let d=data[steps[current].key]||{}; if(current===0)return `<div class="form-grid">${field('Дата поступления','admissionDate',d.admissionDate||'',{type:'date'})}${field('Профиль / отделение','department',d.department||'',{placeholder:'например, терапевтическое'})}${field('Повод для госпитализации','reason',d.reason||'',{full:true,placeholder:'Основной диагноз или клиническая ситуация'})}${field('Жалобы при поступлении','complaints',d.complaints||'',{text:true,full:true,placeholder:'Что беспокоило пациента на момент поступления: симптомы, длительность, выраженность…'})}</div>`;
if(current===1)return `<div class="form-grid">${field('Общее состояние','general',d.general||'',{placeholder:'удовлетворительное / средней тяжести / тяжёлое'})}${field('Сознание и положение','consciousness',d.consciousness||'',{placeholder:'ясное, активное / вынужденное'})}${field('Жизненные показатели','vitals',d.vitals||'',{full:true,placeholder:'АД, ЧСС, ЧДД, SpO₂, температура — вносите с единицами измерения'})}${field('Объективный статус при поступлении','status',d.status||'',{text:true,full:true,placeholder:'Кожа и слизистые, дыхание, сердечно-сосудистая система, живот, отёки, неврологический статус и другие значимые данные…'})}</div>`;
if(current===2)return `<div class="form-grid">${field('Проведённые обследования','tests',d.tests||'',{text:true,full:true,placeholder:'Осмотры специалистов, инструментальные и лабораторные исследования…'})}${field('Лечение и процедуры','therapy',d.therapy||'',{text:true,full:true,placeholder:'Препараты, дозировки, процедуры, режим, кислородная поддержка и т. п.'})}${field('Ответ на лечение','response',d.response||'',{text:true,full:true,placeholder:'Переносимость, эффект, нежелательные реакции, изменения в состоянии…'})}</div>`;
if(current===3)return `<div class="muted-block">Добавляйте только показатели, которые помогают показать клиническую динамику. Значения можно записать одной строкой: «Hb 102→116 г/л; CRP 68→19 мг/л».</div><div class="subsection"><p class="subsection-title">Лабораторные и инструментальные показатели</p><div class="row-list" id="labRows">${(data.labs.rows||[]).map((r,i)=>labRow(r,i)).join('')}</div><button class="button ghost" id="addLab" style="margin-top:12px">＋ Добавить показатель</button></div>${field('Краткая интерпретация динамики','interpretation',data.labs.interpretation||'',{text:true,full:true,placeholder:'Что улучшилось, стабилизировалось или требует контроля? Какие результаты особенно важны для этапного эпикриза?'})}`;
return `<div class="form-grid">${field('Жалобы на момент осмотра','complaintsNow',d.complaintsNow||'',{text:true,full:true,placeholder:'Что беспокоит сейчас; что уменьшилось или исчезло по сравнению с поступлением…'})}${field('Состояние в динамике','dynamics',d.dynamics||'',{text:true,full:true,placeholder:'Общая оценка: лучше / без существенной динамики / ухудшение; переносимость лечения…'})}${field('Объективные данные на момент осмотра','statusNow',d.statusNow||'',{text:true,full:true,placeholder:'Актуальные объективные данные и значимые изменения по сравнению с поступлением…'})}${field('План и рекомендации на следующий этап','plan',d.plan||'',{text:true,full:true,placeholder:'Продолжить лечение, контроль исследований, консультации, наблюдение…'})}</div>`}
function labRow(r={},i){return `<div class="inline-row lab-row"><input class="small-input" data-lab="name" value="${esc(r.name||'')}" placeholder="Показатель"><input class="small-input" data-lab="before" value="${esc(r.before||'')}" placeholder="При поступлении"><input class="small-input" data-lab="after" value="${esc(r.after||'')}" placeholder="На осмотре"><button class="icon-btn remove-lab" title="Удалить показатель">×</button></div>`}
function bindFields(){document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{let key=steps[current].key;data[key][el.dataset.key]=el.value})); if(current===3){document.querySelectorAll('.lab-row').forEach(row=>row.addEventListener('input',saveLabs));$('#addLab').onclick=()=>{data.labs.rows.push({});render()};document.querySelectorAll('.remove-lab').forEach((b,i)=>b.onclick=()=>{data.labs.rows.splice(i,1);render()})}}
function saveLabs(){data.labs.rows=[...document.querySelectorAll('.lab-row')].map(row=>{let r={};row.querySelectorAll('[data-lab]').forEach(x=>r[x.dataset.lab]=x.value);return r})}
function render(){renderSteps();let s=steps[current];$('#stepKicker').textContent=`Шаг ${current+1} · ${s.label.toLowerCase()}`;$('#stepTitle').textContent=s.title;$('#stepDescription').textContent=s.desc;$('#statusChip').textContent=current===4?'Готово к сборке':'Черновик';$('#panel').innerHTML=renderPanel();$('#backBtn').disabled=current===0;$('#backBtn').style.opacity=current===0?.45:1;$('#nextBtn').textContent=current===4?'Собрать эпикриз  ✦':'Далее  →';bindFields()}
function text(v){return (v||'').trim()}
function sentence(v){let x=text(v);return x?(/[.!?]$/.test(x)?x:x+'.'):''}
function makeIntro(){let d=data.context;let date=d.admissionDate?` от ${new Date(d.admissionDate+'T00:00:00').toLocaleDateString('ru-RU')}`:'';let department=d.department?` в ${d.department} отделение`:'';return `Пациент${department} госпитализирован${date}${d.reason?` по поводу ${text(d.reason)}`:''}. При поступлении предъявлял жалобы: ${text(d.complaints)||'жалобы не указаны'}.`}
function buildText(){let c=data.context,o=data.objective,t=data.treatment,l=data.labs,n=data.current;let out=[];out.push('ЭТАПНЫЙ ЭПИКРИЗ');out.push(makeIntro());out.push(`При поступлении состояние оценивалось как ${text(o.general)||'требующее наблюдения'}. Сознание — ${text(o.consciousness)||'ясное'}. Жизненные показатели: ${text(o.vitals)||'не указаны'}. Объективно: ${sentence(o.status)||'данные объективного осмотра не внесены.'}`);if(t.tests||t.therapy||t.response){out.push(`За период наблюдения выполнено: ${sentence(t.tests)||'обследования по профилю заболевания.'} Проведено лечение: ${sentence(t.therapy)||'терапия по клинической ситуации.'} На проводимые мероприятия отмечена следующая реакция: ${sentence(t.response)||'переносимость и эффект требуют уточнения.'}`)}let rows=(l.rows||[]).filter(r=>text(r.name)||text(r.before)||text(r.after));if(rows.length){out.push('В динамике исследований: '+rows.map(r=>`${text(r.name)||'показатель'} — ${text(r.before)||'исходно не указано'} → ${text(r.after)||'на момент осмотра не указано'}`).join('; ')+'.')}if(l.interpretation)out.push(`Динамика интерпретирована следующим образом: ${sentence(l.interpretation)}`);out.push(`На момент текущего осмотра пациент предъявляет жалобы: ${text(n.complaintsNow)||'активные жалобы не предъявляет либо данные не внесены'}. ${sentence(n.dynamics)||'Состояние в динамике не уточнено.'} Объективно: ${sentence(n.statusNow)||'данные текущего объективного осмотра не внесены.'}`);if(n.plan)out.push(`План: ${sentence(n.plan)}`);out.push('Заключение сформировано автоматически на основании внесённых данных и подлежит обязательной проверке лечащим врачом.');return out.join('\n\n')}
function phrase(textValue,style){let s=textValue;if(style===1){s=s.replace(/При поступлении предъявлял жалобы:/g,'В момент госпитализации отмечал').replace(/За период наблюдения выполнено:/g,'В ходе наблюдения проведены').replace(/На момент текущего осмотра пациент предъявляет жалобы:/g,'К настоящему осмотру сохраняются жалобы на').replace(/Объективно:/g,'При объективной оценке:')}else if(style===2){s=s.replace(/При поступлении предъявлял жалобы:/g,'При первичном осмотре беспокоили').replace(/В динамике исследований:/g,'По результатам контрольных исследований:').replace(/План:/g,'На следующем этапе целесообразно:').replace(/Состояние в динамике не уточнено\./g,'Динамику состояния следует оценивать в сопоставлении с исходными данными.')}return s}
function showOutput(){let generated=buildText();variants=[generated,phrase(generated,1),phrase(generated,2)];$('#stepKicker').textContent='Итоговый текст';$('#stepTitle').textContent='Этапный эпикриз собран';$('#stepDescription').textContent='Проверьте фактическую точность, внесите правки и выберите нужный вариант формулировок.';$('#statusChip').textContent='Проверка врача';$('#panel').innerHTML=`<div class="output-shell"><div><p class="output-title">Редактор текста</p><textarea id="outputText" class="output-editor">${esc(generated)}</textarea><div class="tools"><button class="button primary" id="copyBtn">⧉ Копировать</button><button class="button secondary" id="printBtn">Печать / PDF</button><button class="button ghost" id="newBtn">Начать заново</button></div></div><aside class="side-note"><h3>Перефразировать без потери фактов</h3><p>Выберите вариант. Содержание и внесённые показатели сохраняются, меняются только связки и формулировки.</p><div class="variant-list"><button class="variant" data-v="0">Вариант 1 · нейтральный</button><button class="variant" data-v="1">Вариант 2 · клинический</button><button class="variant" data-v="2">Вариант 3 · компактный</button></div><div class="divider"></div><p><strong>Важно:</strong> генератор не устанавливает диагноз и не заменяет клиническое решение.</p></aside></div>`;$('.nav').innerHTML='<button class="button ghost" id="backBtn">← Вернуться к данным</button><div class="nav-right"><button class="button primary" id="nextBtn">Собрать заново  ✦</button></div>';$('#backBtn').onclick=()=>{current=4;render()};$('#nextBtn').onclick=showOutput;$('#copyBtn').onclick=()=>{navigator.clipboard?.writeText($('#outputText').value);toast('Текст скопирован в буфер обмена')};$('#printBtn').onclick=()=>window.print();$('#newBtn').onclick=()=>{data={context:{},objective:{},treatment:{},labs:{rows:[]},current:{}};current=0;render();toast('Новый черновик создан')};document.querySelectorAll('.variant').forEach(b=>b.onclick=()=>{$('#outputText').value=variants[+b.dataset.v];document.querySelectorAll('.variant').forEach(x=>x.style.borderColor='#cbd9da');b.style.borderColor='var(--mint-strong)';toast('Формулировка обновлена')});document.querySelector('.nav').style.display='flex'}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function demo(){data={context:{admissionDate:'2026-10-24',department:'терапевтическое',reason:'внебольничная пневмония нижней доли правого лёгкого',complaints:'Повышение температуры тела до 38,5 °C, кашель с отделением небольшого количества мокроты, одышка при умеренной физической нагрузке, общая слабость в течение 5 дней.'},objective:{general:'средней тяжести',consciousness:'ясное, положение активное',vitals:'АД 126/78 мм рт. ст., ЧСС 92 в минуту, ЧДД 20 в минуту, SpO₂ 95% на атмосферном воздухе, температура 37,8 °C',status:'Кожные покровы обычной окраски, умеренно влажные. В нижних отделах справа дыхание ослаблено, выслушиваются мелкопузырчатые влажные хрипы. Тоны сердца приглушены, ритм правильный. Живот мягкий, безболезненный. Периферических отёков нет.'},treatment:{tests:'Выполнены общий анализ крови, биохимический анализ крови, С-реактивный белок, рентгенография органов грудной клетки; проведён осмотр врача-терапевта.',therapy:'Назначена антибактериальная терапия, муколитическая терапия, жаропонижающие препараты по требованию, дыхательная гимнастика и щадящий режим.',response:'Лечение переносит удовлетворительно. На фоне терапии отмечается снижение температуры и уменьшение выраженности одышки.'},labs:{rows:[{name:'Лейкоциты',before:'13,2 ×10⁹/л',after:'8,9 ×10⁹/л'},{name:'С-реактивный белок',before:'68 мг/л',after:'19 мг/л'},{name:'SpO₂',before:'93% без кислорода',after:'95% без кислорода'}],interpretation:'Положительная лабораторная динамика: уменьшение лейкоцитоза и уровня С-реактивного белка.'},current:{complaintsNow:'Сохраняется умеренный кашель с небольшим количеством мокроты. Лихорадка не отмечается.',dynamics:'Общее состояние с положительной динамикой, переносимость терапии удовлетворительная.',statusNow:'Температура 36,8 °C, гемодинамика стабильна. Дыхание справа в нижних отделах несколько ослаблено, хрипы единичные. Признаков дыхательной недостаточности в покое нет.',plan:'Продолжить назначенную терапию, контроль общего анализа крови и С-реактивного белка в динамике, наблюдение врача-терапевта.'}};current=0;render();toast('Демонстрационные данные загружены')}
$('#backBtn').onclick=()=>{if(current>0){current--;render()}};$('#nextBtn').onclick=()=>{if(current<4){current++;render()}else showOutput()};$('#demoBtn').onclick=demo;render();
</script></body></html>
